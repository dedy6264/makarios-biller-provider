<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ConfigCenter - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"

        rel="stylesheet" />

                extend: {

                        "primary-fixed": "#e2dfff",
                        "outline-variant": "#c7c4d8",
                        "tertiary-fixed": "#ffdbcc",
                        "inverse-surface": "#213145",
                        "primary-container": "#4f46e5",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface": "#0b1c30",
                        "tertiary": "#7e3000",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-fixed": "#351000",
                        "tertiary-container": "#a44100",
                        "primary": "#3525cd",
                        "on-error": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "on-primary-fixed": "#0f0069",
                        "secondary-container": "#e0e3e5",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-container": "#ffd2be",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#626567",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-background": "#0b1c30",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "secondary-fixed-dim": "#c4c7c9",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-secondary-fixed-variant": "#444749",
                        "surface-dim": "#cbdbf5",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "surface-container-low": "#eff4ff",
                        "error": "#ba1a1a",
                        "surface-tint": "#4d44e3",
                        "on-secondary-fixed": "#191c1e",
                        "on-primary-container": "#dad7ff",
                        "secondary": "#5c5f61"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "card-gap": "24px",
                        "container-padding-mobile": "16px",
                        "container-padding-desktop": "32px",
                        "unit": "8px"
                    },
                    "fontFamily": {

                        "body-sm": [

    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #E2E8F0;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.08);
        }

        .bg-pattern {
            background-color: #f8f9ff;
            background-image: radial-gradient(#dce9ff 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>

<body
    class="flex items-center justify-center min-h-screen antialiased bg-pattern font-body-sm text-body-sm text-on-surface p-container-padding-mobile md:p-container-padding-desktop">
    <div class="glass-panel w-full max-w-[420px] rounded-[24px] p-gutter relative overflow-hidden">
        <!-- Decorative Header Blur -->
        <div
            class="absolute w-32 h-32 rounded-full pointer-events-none -top-10 -right-10 bg-primary-container/20 blur-3xl">
        </div>
        <div
            class="absolute w-32 h-32 rounded-full pointer-events-none -bottom-10 -left-10 bg-surface-tint/20 blur-3xl">
        </div>
        <div class="relative z-10">
            <!-- Brand / Logo -->
            <div class="mb-8 text-center">
                <div class="flex items-center justify-center mb-2 space-x-2">
                    <span class="material-symbols-outlined text-[32px] text-primary"
                        style="font-variation-settings: 'FILL' 1;">settings_b_roll</span>
                    <h1 class="font-bold tracking-tight font-headline-lg text-headline-lg text-primary">ConfigCenter
                    </h1>
                </div>
                <p class="tracking-widest uppercase font-label-caps text-label-caps text-secondary">System Admin</p>
            </div>
            <!-- Header -->
            <div class="mb-8 text-center">
                <h2
                    class="mb-2 font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                    Selamat Datang Kembali</h2>
                <p class="font-body-md text-body-md text-on-surface-variant">Silakan masuk ke akun Anda</p>
            </div>
            <!-- Form -->
            <form action="#" class="space-y-6" method="POST">
                <!-- Username / Email -->
                <div class="space-y-2">
                    <label class="block font-medium font-body-sm text-body-sm text-on-surface-variant"
                        for="username">Username atau Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <span class="material-symbols-outlined text-outline">person</span>
                        </div>
                        <input
                            class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-[#F1F5F9] focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-colors duration-200"
                            id="username" name="username" placeholder="admin@configcenter.com" required=""
                            type="text" />
                    </div>
                </div>
                <!-- Password -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="block font-medium font-body-sm text-body-sm text-on-surface-variant"
                            for="password">Password</label>
                        <a class="transition-colors font-body-sm text-body-sm text-primary hover:text-primary-container"
                            href="#">Lupa Kata Sandi?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <span class="material-symbols-outlined text-outline">lock</span>
                        </div>
                        <input
                            class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-[#F1F5F9] focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-colors duration-200"
                            id="password" name="password" placeholder="••••••••" required="" type="password" />
                        <button
                            class="absolute inset-y-0 right-0 flex items-center pr-3 transition-colors text-outline hover:text-on-surface-variant focus:outline-none"
                            onclick="togglePassword()" type="button">
                            <span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
                        </button>
                    </div>
                </div>
                <!-- Remember Me -->
                <div class="flex items-center">
                    <input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-[#F1F5F9]"
                        id="remember-me" name="remember-me" type="checkbox" />
                    <label class="block ml-2 font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Ingat Saya
                    </label>
                </div>
                <!-- Submit Button -->
                <div>
                    <button
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-body-md text-body-md font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 h-[44px] items-center"
                        type="submit">
                        Masuk
                    </button>
                </div>
            </form>
            <div class="pt-6 mt-8 text-center border-t border-outline-variant/30">
                <p class="font-body-sm text-body-sm text-on-surface-variant">© 2024 ConfigCenter Admin Portal.</p>
            </div>
        </div>
    </div>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body>

</html>
